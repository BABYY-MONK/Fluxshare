name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/release-ready
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: fluxshare-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android platform files when needed
        run: bash scripts/prepare_android.sh
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build installable Android APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://sttizuudxfbemiazlhiq.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_X0WSVFiaxl_YJiyqW4zJCQ_plQUR4TM' }}
          FLUXSHARE_PUBLIC_URL: ${{ vars.FLUXSHARE_PUBLIC_URL || 'https://fluxshare-lac.vercel.app' }}
          LIBREOFFICE_URL: ${{ vars.LIBREOFFICE_URL || 'https://fluxshare-converter-monks-projects-8f76cf4b.vercel.app/convert' }}
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=FLUXSHARE_PUBLIC_URL=$FLUXSHARE_PUBLIC_URL
          --dart-define=LIBREOFFICE_URL=$LIBREOFFICE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: FluxShare-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APK to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
