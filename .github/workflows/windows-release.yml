name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: fluxshare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://sttizuudxfbemiazlhiq.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_X0WSVFiaxl_YJiyqW4zJCQ_plQUR4TM' }}
          --dart-define=FLUXSHARE_PUBLIC_URL=${{ vars.FLUXSHARE_PUBLIC_URL || 'https://fluxshare-lac.vercel.app' }}
          --dart-define=LIBREOFFICE_URL=${{ vars.LIBREOFFICE_URL || 'https://fluxshare-converter-monks-projects-8f76cf4b.vercel.app/convert' }}
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not installed.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $buildDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $installerOut = (Resolve-Path 'dist').Path
          & $compiler "/DBuildDir=$buildDir" "/DInstallerOut=$installerOut" installer\FluxShare.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FluxShare-Windows-x64-Installer
          path: dist/FluxShare-Setup-x64.exe
          if-no-files-found: error
      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FluxShare-Setup-x64.exe
