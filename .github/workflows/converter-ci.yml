name: Document and media converter CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - 'services/document-converter/**'
      - '.github/workflows/converter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/document-converter/**'
      - '.github/workflows/converter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        working-directory: services/document-converter
        run: python -m pip install -r requirements.txt httpx
      - name: Run converter API tests
        working-directory: services/document-converter
        run: python -m unittest discover -s test -v
      - name: Build converter container
        run: docker build -t fluxshare-converter services/document-converter

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/release-ready'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        working-directory: services/document-converter
        run: python -m pip install -r requirements.txt
      - name: Smoke-test the live Vercel converter
        working-directory: services/document-converter
        env:
          FLUXSHARE_CONVERTER_URL: ${{ vars.LIBREOFFICE_URL || 'https://fluxshare-converter.vercel.app/convert' }}
        run: python test/smoke_live.py
