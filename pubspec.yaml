name: fluxshare
description: FluxShare - A browser-based file sharing and format conversion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Phase 1 — core
  file_picker: ^8.0.0
  image: ^4.1.7
  pdf: ^3.10.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  # Phase 2 — Firebase backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.1
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1
  # Phase 2 — sharing
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
