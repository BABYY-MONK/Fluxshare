name: fluxshare
description: Browser-based file conversion and sharing.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  archive: ^4.5.2
  html: ^0.15.6
  file_picker: ^10.3.10
  google_fonts: ^6.2.1
  http: ^1.2.2
  image: ^4.12.0
  markdown: ^7.2.2
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  web: ^1.1.0
  xml: ^7.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto-BoldItalic.ttf
