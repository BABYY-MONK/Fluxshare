<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FluxShare — Convert and share files instantly in your browser. JPG, PNG, WEBP, PDF and more. No uploads, no sign-in.">
  <meta name="theme-color" content="#0A0E1A">

  <!-- Open Graph -->
  <meta property="og:title" content="FluxShare — Convert & Share Files Instantly">
  <meta property="og:description" content="Browser-based file conversion. JPG, PNG, WEBP, PDF. Fast, private, free.">
  <meta property="og:type" content="website">

  <title>FluxShare — Convert & Share Files Instantly</title>

  <!-- Fonts preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: #0A0E1A;
      height: 100%;
      overflow: hidden;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0A0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #loading-screen .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    #loading-screen .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    #loading-screen .logo-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #3B82F6, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid #1C2435;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-label {
      margin-top: 16px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.3px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Splash screen shown while Flutter loads -->
  <div id="loading-screen">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">FluxShare</span>
    </div>
    <div class="loader-ring"></div>
    <p class="loader-label">Initialising converter…</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', () => {
      const screen = document.getElementById('loading-screen');
      if (screen) {
        screen.classList.add('hidden');
        setTimeout(() => screen.remove(), 700);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
